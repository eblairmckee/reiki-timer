<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Tarot Flash — artwork references</title>
    <style>
    :root {
      font-family: system-ui, sans-serif;
      color: rgb(37 37 37);
      color-scheme: light;
      background: rgb(238 234 228);
    }
    * {
      box-sizing: border-box;
    }
    body {
      max-width: 1440px;
      padding: 32px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 28px;
    }
    h1 {
      margin: 0 0 12px;
      font:
        500 32px / 1.2 Georgia,
        serif;
    }
    p {
      max-width: 760px;
      line-height: 1.5;
    }
    a {
      color: inherit;
    }
    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: 600;
    }
    select {
      max-width: 100%;
      padding: 10px;
      font: inherit;
      background: white;
      border: 1px solid rgb(153 153 153);
      border-radius: 6px;
    }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
    }
    body.single main {
      grid-template-columns: repeat(2, minmax(0, 420px));
      justify-content: center;
    }
    figure {
      min-width: 0;
      margin: 0;
    }
    body.single figure {
      grid-row: var(--cell-row);
      grid-column: var(--cell-column);
      order: var(--cell-order);
    }
    body.one main {
      grid-template-columns: minmax(0, 420px);
    }
    figure[hidden] {
      display: none;
    }
    .art {
      position: relative;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: white;
      border-radius: 8px;
    }
    .art img {
      position: absolute;
      width: 200%;
      max-width: none;
      height: 200%;
    }
    figcaption {
      padding: 12px 2px;
    }
    figcaption strong,
    figcaption span {
      display: block;
    }
    figcaption span {
      margin-top: 5px;
      font-size: 12px;
      color: rgb(96 96 96);
    }
    @media (max-width: 600px) {
      body {
        padding: 20px;
      }
      main {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      figcaption {
        font-size: 14px;
      }
    }
    </style>
  </head>

    <script>
    "use strict";
    const picker = document.querySelector("#sheet");
    const sheets = new Set(Array.from(picker.options, (option) => option.value));
    const requested = new URLSearchParams(location.search).get("sheet") || "";
    function showSheet(value) {
      document.body.classList.toggle("single", Boolean(value));
      for (const tile of document.querySelectorAll("figure")) {
        tile.hidden = Boolean(value) && tile.dataset.sheet !== value;
      }
      document.body.classList.toggle(
        "one",
        document.querySelectorAll("figure:not([hidden])").length === 1
      );
      picker.value = value;
    }
    showSheet(sheets.has(requested) ? requested : "");
    picker.addEventListener("change", () => {
      const url = new URL(location.href);
      if (picker.value) {
        url.searchParams.set("sheet", picker.value);
      } else {
        url.searchParams.delete("sheet");
      }
      history.replaceState(null, "", url);
      showSheet(picker.value);
    });
    </script>
